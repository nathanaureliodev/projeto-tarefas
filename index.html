<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cardápio Digital</title>
  <link rel="stylesheet" href="style.css">
    
</head>
<body>
  <h1>🍔 Cardápio da Lanchonete</h1>
  <div class="cardapio">

  <div class="menu-item">
    <div class="image-container">
      <img src="hamburguer.jpg" alt="Hambúrguer" class="food-img">
      <img src="logo-burger.png" alt="Logo Hambúrguer" class="logo-overlay">
    </div>
    <h2>Hambúrguer Clássico</h2>
    <p>Pão, carne, queijo e salada.</p>
    <p class="price">R$ 20,00</p>
  </div>

  <div class="menu-item">
    <div class="image-container">
      <img src="pizza.jpg" alt="Pizza" class="food-img">
      <img src="logo-pizza.png" alt="Logo Pizza" class="logo-overlay">
    </div>
    <h2>Pizza Mussarela</h2>
    <p>Massa crocante com queijo derretido.</p>
    <p class="price">R$ 35,00</p>
  </div>

  <div class="menu-item">
    <div class="image-container">
      <img src="suco.jpg" alt="Suco Natural" class="food-img">
      <img src="logo-drink.png" alt="Logo Bebida" class="logo-overlay">
    </div>
    <h2>Suco Natural</h2>
    <p>Refrescante e saudável.</p>
    <p class="price">R$ 8,00</p>
  </div>

</div>

  </div>
</body>
</html>
