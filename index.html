<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cardápio Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Faixa animada (opção 4 adaptada) -->
  <header class="anim-band">
    <!-- papel: título principal que ficará sobre o fundo fotorealista -->
    <h1 tabindex="0">🍔 Cardápio da Lanchonete</h1>
  </header>

  <div class="cardapio">

    <!-- Item Hambúrguer -->
    <div class="menu-item">
      <div class="image-container">
        <span class="emoji">🍔</span>
      </div>
      <h2>Hambúrguer Clássico</h2>
      <p>Pão, carne, queijo e salada.</p>
      <p class="price">R$ 20,00</p>
    </div>

    <!-- Item Pizza -->
    <div class="menu-item">
      <div class="image-container">
        <span class="emoji">🍕</span>
      </div>
      <h2>Pizza Mussarela</h2>
      <p>Massa crocante com queijo derretido.</p>
      <p class="price">R$ 35,00</p>
    </div>

    <!-- Item Bebida -->
    <div class="menu-item">
      <div class="image-container">
        <span class="emoji">🥤</span>
      </div>
      <h2>Suco Natural</h2>
      <p>Refrescante e saudável.</p>
      <p class="price">R$ 8,00</p>
    </div>

  </div>

  <!-- Faixa fixa no rodapé (mantida) -->
  <footer class="faixa">
    <p>🍔🍕🥤 Venha saborear!</p>
  </footer>

</body>
</html>
